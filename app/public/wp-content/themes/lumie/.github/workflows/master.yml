name: Check PR Source

on:
    pull_request:
        branches:
            - master

jobs:
    check-pr:
        runs-on: ubuntu-latest
        steps:
            - name: Check if PR comes from 'development' branch
              run: |
                  echo "PR source branch: ${{ github.head_ref }}"
                  if [[ "${{ github.head_ref }}" != "development" && "${{ github.head_ref }}" != hotfix/* ]]; then
                      echo "::error::PR must come from 'development' or 'hotfix/*' branch."
                      exit 1
                  fi
