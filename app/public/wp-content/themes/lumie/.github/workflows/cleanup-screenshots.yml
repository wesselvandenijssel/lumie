name: Cleanup Screenshots After Merge
on:
    pull_request:
        types: [closed]
        branches: [development]

permissions:
    contents: write
    pull-requests: write

jobs:
    cleanup:
        # Only run if PR was merged (not just closed)
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: development
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Remove screenshots directory
              run: |
                  if [ -d "playwright/screenshots" ]; then
                    echo "Removing screenshots..."
                    rm -rf playwright/screenshots/*
                    echo "Screenshots removed"
                  else
                    echo "No screenshots directory found"
                  fi

            - name: Commit cleanup to a new branch
              id: commit
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  if [ -z "$(git status --porcelain)" ]; then
                    echo "No changes to commit"
                    echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  branch="chore/cleanup-screenshots-${{ github.event.pull_request.number }}"
                  git checkout -b "$branch"
                  git add playwright/screenshots
                  git commit -m "chore: cleanup screenshots after PR #${{ github.event.pull_request.number }} merge"
                  git push origin "$branch" --force
                  echo "has_changes=true" >> "$GITHUB_OUTPUT"
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"

            - name: Open and merge cleanup PR
              if: steps.commit.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  branch="${{ steps.commit.outputs.branch }}"

                  pr_url=$(gh pr create \
                    --base development \
                    --head "$branch" \
                    --title "chore: cleanup screenshots after PR #${{ github.event.pull_request.number }} merge" \
                    --body "Automated cleanup of \`playwright/screenshots\` after PR #${{ github.event.pull_request.number }} was merged into \`development\`.")

                  echo "Created $pr_url"

                  # The required "build" check can't run immediately: PRs opened by
                  # github-actions[bot] need manual workflow approval (see
                  # approve-bot-workflow-runs.yml), so merge with --auto to wait for
                  # the check to pass instead of failing on an immediate merge attempt.
                  gh pr merge "$pr_url" --squash --delete-branch --auto
