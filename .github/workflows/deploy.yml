name: Deploy to production

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run — show what rsync would transfer without writing anything"
                type: boolean
                default: false

# Never let two deploys write to the server at the same time.
concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production

        env:
            THEME_SRC: app/public/wp-content/themes/lumie
            PLUGINS_SRC: app/public/wp-content/plugins
            # Custom plugins tracked in this repo (space separated).
            PLUGINS: "lumie-customer-journey lumie-widgets"
            # Only the Font Awesome kit is deployed from node_modules — enqueueing.php
            # loads its CSS (and filemtime's it) straight out of node_modules.
            FA_KIT: node_modules/@awesome.me/kit-47e6dc046c
            FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_TOKEN }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Fail fast: the build takes minutes, so verify the server is reachable first.
            # GitHub runners have no IPv6, hence the forced IPv4 check.
            - name: Check server reachability
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
              run: |
                  echo "Resolving $SSH_HOST ..."
                  getent ahostsv4 "$SSH_HOST" || echo "::warning::No IPv4 address resolved."
                  if nc -z -4 -w 20 "$SSH_HOST" "$SSH_PORT"; then
                      echo "Reachable over IPv4 on port $SSH_PORT."
                  else
                      echo "::error::Cannot reach $SSH_HOST on port $SSH_PORT over IPv4 from this runner. The host is likely firewalled to specific IPs — ask the hosting provider to allow GitHub Actions, or deploy from a self-hosted runner."
                      exit 1
                  fi

            # Also before the build, so a bad key or known_hosts fails in seconds
            # rather than after several minutes of compiling.
            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts

                  # Catch a malformed or truncated secret here rather than at rsync time,
                  # where ssh falls back to password auth and reports a confusing error.
                  if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
                      echo "::error::SSH_PRIVATE_KEY is not a valid unencrypted private key. Store the full contents of the private key file, including the BEGIN and END lines, and make sure it has no passphrase."
                      exit 1
                  fi
                  if [ ! -s ~/.ssh/known_hosts ]; then
                      echo "::error::SSH_KNOWN_HOSTS is empty. Set it to the output of: ssh-keyscan -p <port> <host>"
                      exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: app/public/wp-content/themes/lumie/package-lock.json

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  tools: composer:v2
                  coverage: none

            # The committed .npmrc has a hard-coded Font Awesome token. Overwrite it in CI
            # so the private kit is fetched with the rotated secret instead. npm expands
            # ${FONTAWESOME_TOKEN} at read time, so the token never lands on disk.
            - name: Configure private npm registry
              working-directory: ${{ env.THEME_SRC }}
              run: |
                  cat > .npmrc <<'EOF'
                  @awesome.me:registry=https://npm.fontawesome.com/
                  @fortawesome:registry=https://npm.fontawesome.com/
                  //npm.fontawesome.com/:_authToken=${FONTAWESOME_TOKEN}
                  EOF

            - name: Install npm dependencies
              working-directory: ${{ env.THEME_SRC }}
              run: npm ci

            # Runs ESLint and Stylelint as part of the webpack build — lint errors fail here.
            - name: Build theme assets
              working-directory: ${{ env.THEME_SRC }}
              run: npm run build

            # src/functions/autoload.php requires vendor/autoload.php at runtime.
            - name: Install Composer dependencies
              working-directory: ${{ env.THEME_SRC }}
              run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            - name: Verify build output
              working-directory: ${{ env.THEME_SRC }}
              run: |
                  for file in dist/main.css dist/main.js dist/admin.css dist/fancybox/fancybox.js vendor/autoload.php "$FA_KIT/icons/css/all.min.css"; do
                      if [ ! -f "$file" ]; then
                          echo "::error::Expected build artefact missing: $file"
                          exit 1
                      fi
                  done
                  echo "All expected build artefacts present."

            # rsync does not create missing parent directories, so a fresh server
            # fails with "mkdir ... No such file or directory". Create the targets
            # up front and report what is actually at REMOTE_PATH.
            - name: Prepare remote directories
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
                  REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
              run: |
                  ssh -4 -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ConnectTimeout=20 -o BatchMode=yes -o IdentitiesOnly=yes \
                      "$SSH_USER@$SSH_HOST" "REMOTE_PATH='$REMOTE_PATH' PLUGINS='$PLUGINS' FA_KIT='$FA_KIT' bash -s" <<'REMOTE'
                  set -e

                  # A secret can carry a trailing slash, stray whitespace, a CR from a
                  # Windows paste, or a leading ~ that stays literal inside quotes.
                  REMOTE_PATH="$(printf '%s' "$REMOTE_PATH" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
                  case "$REMOTE_PATH" in
                      "~/"*) REMOTE_PATH="$HOME/${REMOTE_PATH#\~/}" ;;
                      "~") REMOTE_PATH="$HOME" ;;
                  esac
                  while [ "${REMOTE_PATH%/}" != "$REMOTE_PATH" ] && [ "$REMOTE_PATH" != "/" ]; do
                      REMOTE_PATH="${REMOTE_PATH%/}"
                  done

                  if [ ! -d "$REMOTE_PATH" ]; then
                      echo "REMOTE_PATH does not exist: $REMOTE_PATH"
                      echo "--- Diagnostics ---"
                      echo "length after cleaning: ${#REMOTE_PATH}"
                      echo "first character: $(printf '%s' "$REMOTE_PATH" | cut -c1)"
                      echo "absolute path: $(case "$REMOTE_PATH" in /*) echo yes ;; *) echo "NO - must start with /" ;; esac)"
                      echo "HOME is: $HOME"
                      echo "--- Candidates that do exist ---"
                      for c in "$HOME/domains"/*/public_html; do
                          [ -d "$c" ] && echo "EXISTS: $c$([ -f "$c/wp-config.php" ] && echo '  (WordPress)')"
                      done
                      echo "--- Home directory ($HOME) ---"
                      ls -la "$HOME" 2>/dev/null | head -25
                      if [ -d "$HOME/domains" ]; then
                          echo "--- $HOME/domains ---"
                          ls -la "$HOME/domains" 2>/dev/null
                      fi
                      echo "--- WordPress installations found under $HOME ---"
                      find "$HOME" -maxdepth 5 -name wp-config.php 2>/dev/null | head -10 || true
                      echo "::error::REMOTE_PATH does not exist on the server. Set the secret to the WordPress root — one of the paths listed above, typically /home/<user>/domains/<domain>/public_html"
                      exit 1
                  fi
                  echo "--- Contents of $REMOTE_PATH ---"
                  ls -la "$REMOTE_PATH" | head -25
                  if [ ! -f "$REMOTE_PATH/wp-config.php" ] && [ ! -d "$REMOTE_PATH/wp-includes" ]; then
                      echo "::warning::No WordPress installation found at REMOTE_PATH (no wp-config.php, no wp-includes). The theme will be uploaded but nothing will use it until WordPress is installed there."
                  fi
                  # node_modules is excluded from the theme sync, so the kit's parent
                  # directories are never created by it.
                  mkdir -p "$REMOTE_PATH/wp-content/themes/lumie/$FA_KIT"
                  for plugin in $PLUGINS; do
                      mkdir -p "$REMOTE_PATH/wp-content/plugins/$plugin"
                  done
                  echo "--- Remote directories ready ---"
                  REMOTE

            - name: Deploy theme
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
                  REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
                  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
              run: |
                  rsync -rlptzv --delete $DRY_RUN \
                      --exclude-from=.github/deploy-excludes.txt \
                      -e "ssh -4 -i ~/.ssh/deploy_key -p $SSH_PORT -o ConnectTimeout=20 -o BatchMode=yes -o IdentitiesOnly=yes" \
                      "$THEME_SRC/" \
                      "$SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/themes/lumie/"

            # Deployed separately because node_modules is excluded from the theme sync.
            - name: Deploy Font Awesome kit
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
                  REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
                  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
              run: |
                  rsync -rlptzv --delete $DRY_RUN \
                      -e "ssh -4 -i ~/.ssh/deploy_key -p $SSH_PORT -o ConnectTimeout=20 -o BatchMode=yes -o IdentitiesOnly=yes" \
                      "$THEME_SRC/$FA_KIT/" \
                      "$SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/themes/lumie/$FA_KIT/"

            - name: Deploy custom plugins
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
                  REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
                  DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
              run: |
                  for plugin in $PLUGINS; do
                      echo "--- Deploying $plugin ---"
                      rsync -rlptzv --delete $DRY_RUN \
                          --exclude-from=.github/deploy-excludes.txt \
                          -e "ssh -4 -i ~/.ssh/deploy_key -p $SSH_PORT -o ConnectTimeout=20 -o BatchMode=yes -o IdentitiesOnly=yes" \
                          "$PLUGINS_SRC/$plugin/" \
                          "$SSH_USER@$SSH_HOST:$REMOTE_PATH/wp-content/plugins/$plugin/"
                  done

            # filemtime() cache-busting changes on deploy, but WP Rocket serves cached HTML
            # that still references the old asset URLs until its cache is cleared.
            - name: Flush caches
              if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
                  REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
              run: |
                  ssh -4 -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" \
                      "cd '$REMOTE_PATH' && wp cache flush --skip-plugins --skip-themes && wp rocket clean --confirm" \
                      || echo "::warning::Cache flush failed or WP-CLI is unavailable — clear caches manually."

            - name: Remove SSH key
              if: always()
              run: rm -f ~/.ssh/deploy_key
